name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_web:
        description: 'Build Web Version'
        required: true
        default: true
        type: boolean
      build_apk:
        description: 'Build Android APK Version'
        required: true
        default: false
        type: boolean

jobs:
  build_web:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  build_apk:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_apk == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
