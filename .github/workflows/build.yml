name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_web:
        description: 'Build Web Version'
        required: true
        default: true
        type: boolean
      build_apk:
        description: 'Build Android APK Version'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        if: ${{ github.event_name == 'push' || github.event.inputs.build_web == 'true' }}
        run: flutter build web

      - name: Build APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_apk == 'true' }}
        run: flutter build apk --release

      - name: Upload APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_apk == 'true' }}
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web
        if: ${{ github.event_name == 'push' || github.event.inputs.build_web == 'true' }}
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: build/web/
